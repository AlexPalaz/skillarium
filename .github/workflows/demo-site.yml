name: Demo site

# Builds the bundled example project with the CLI from this repository and
# publishes it to GitHub Pages, as a live demo of the viewer.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Project sites live at /<repository-name>/
      - run: >
          node packages/cli/bin/skillarium.js build
          --root examples/sample-project
          --out-dir "$RUNNER_TEMP/demo-site"
          --base "/${{ github.event.repository.name }}/"
          --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/demo-site
      - id: deployment
        uses: actions/deploy-pages@v4
